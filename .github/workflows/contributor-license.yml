name: Contributor License Grant

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  affirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Require contributor grant affirmation
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body ?? '';
            const grant = 'I have read `CONTRIBUTING.md`, have the right to submit this contribution, and grant the rights described there, including the right to offer my contribution under the project\'s AGPL and alternative commercial licenses.';
            const affirmed = body
              .split(/\r?\n/u)
              .some((line) => line.trim() === `- [x] ${grant}` || line.trim() === `- [X] ${grant}`);
            if (!affirmed) {
              core.setFailed('A human contributor must edit the PR description and check the Contribution grant affirmation supplied by .github/PULL_REQUEST_TEMPLATE.md before this contribution can be merged. Agents must leave this affirmation for the accountable human.');
            }
