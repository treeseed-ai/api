name: Build or Promote TreeSeed API Candidate

on:
  push:
    branches: [staging, main]
    tags: ["*.*.*", "!*-runtime.*"]

jobs:
  candidate-source:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: ./scripts/build/hydrate-exact-sdk.sh artifacts/sealed-sdk download
        env: { GH_TOKEN: "${{ secrets.TREESEED_GITHUB_TOKEN || github.token }}" }
      - run: npm ci --ignore-scripts --no-audit --no-fund && ./scripts/build/hydrate-exact-sdk.sh artifacts/sealed-sdk install
      - run: npm run verify:direct
      - run: mkdir -p source-assets && npm pack --json --ignore-scripts --pack-destination source-assets && npm sbom --sbom-format cyclonedx > source-assets/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "api-source-${{ github.sha }}"
          path: |
            source-assets/
            artifacts/sealed-sdk/
          if-no-files-found: error

  candidate-build:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    needs: candidate-source
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { image: "treeseed/api", target: api, arch: amd64, platform: "linux/amd64", runner: ubuntu-24.04 }
          - { image: "treeseed/api", target: api, arch: arm64, platform: "linux/arm64", runner: ubuntu-24.04-arm }
          - { image: "treeseed/op-runner", target: operations-runner, arch: amd64, platform: "linux/amd64", runner: ubuntu-24.04 }
          - { image: "treeseed/op-runner", target: operations-runner, arch: arm64, platform: "linux/arm64", runner: ubuntu-24.04-arm }
          - { image: "treeseed/api-postgres", target: database, arch: amd64, platform: "linux/amd64", runner: ubuntu-24.04 }
          - { image: "treeseed/api-postgres", target: database, arch: arm64, platform: "linux/arm64", runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "api-source-${{ github.sha }}", path: . }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: { username: "${{ vars.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ matrix.image }}:candidate-${{ github.sha }}-${{ matrix.arch }}
          sbom: true
          provenance: mode=max

  candidate-seal:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    needs: candidate-build
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "api-source-${{ github.sha }}", path: release-assets }
      - name: Promote declared source assets into the sealed candidate root
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sourcePackages < <(find release-assets/source-assets -maxdepth 1 -type f -name '*.tgz' -print0)
          test "${#sourcePackages[@]}" -eq 1
          test -f release-assets/source-assets/sbom.cdx.json
          install -m 0644 "${sourcePackages[0]}" release-assets/
          install -m 0644 release-assets/source-assets/sbom.cdx.json release-assets/
      - run: npm ci --ignore-scripts --no-audit --no-fund && ./scripts/build/hydrate-exact-sdk.sh release-assets install
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: { username: "${{ vars.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - name: Seal exact manifests and component assets
        shell: bash
        run: |
          set -euo pipefail
          for pair in api=treeseed/api runner=treeseed/op-runner database=treeseed/api-postgres; do
            key="${pair%%=*}"; image="${pair#*=}"; candidate="candidate-${GITHUB_SHA}"
            docker buildx imagetools create -t "${image}:${candidate}" "${image}:${candidate}-amd64" "${image}:${candidate}-arm64"
            digest="$(docker buildx imagetools inspect "${image}:${candidate}" --format '{{json .Manifest}}' | jq -r '.digest')"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; export "TREESEED_${key^^}_DIGEST=$digest"
          done
          export TREESEED_RELEASE="$(node -p "require('./package.json').version")" TREESEED_SOURCE_COMMIT="$GITHUB_SHA"
          export TREESEED_RUNNER_DIGEST TREESEED_DATABASE_DIGEST TREESEED_API_DIGEST
          node --import tsx scripts/release/create-component-release.ts
          npm run release:custody -- seal release-assets/release-evidence-v1.json release-assets
          npm run release:custody -- verify release-assets/release-evidence-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "api-candidate-${{ github.sha }}", path: release-assets/, if-no-files-found: error, retention-days: 30 }

  promote:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions: { actions: read, contents: write }
    environment: ${{ contains(github.ref_name, '-') && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Download exact protected candidate
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then candidate_branch=staging; else candidate_branch=main; fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${candidate_branch}")"
          run_id=""
          for attempt in {1..120}; do
            run_id="$(gh run list --workflow publish.yml --branch "$candidate_branch" --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            [[ -n "$run_id" ]] && break
            if (( attempt % 6 == 0 )); then
              echo "Waiting for the exact protected image candidate (${attempt}0s elapsed)."
            fi
            sleep 10
          done
          test -n "$run_id"; gh run download "$run_id" --name "api-candidate-${GITHUB_SHA}" --dir candidate
      - run: npm ci --ignore-scripts --no-audit --no-fund && ./scripts/build/hydrate-exact-sdk.sh candidate install
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: { username: "${{ vars.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - name: Verify accepted protected candidate
        run: |
          npm run release:check-tag
          npm run release:custody -- verify candidate/release-evidence-v1.json
      - name: Promote exact OCI manifests without building
        run: |
          node -e "const e=require('./candidate/release-evidence-v1.json'); for(const a of e.artifacts.filter(x=>x.kind==='oci-image')) console.log(a.identity)" | while read -r identity; do
            image="${identity%@*}"; digest="${identity#*@}"
            docker buildx imagetools inspect "${image}@${digest}" >/dev/null
            docker buildx imagetools create -t "${image}:${GITHUB_REF_NAME}" "${image}@${digest}"
            test "$(docker buildx imagetools inspect "${image}:${GITHUB_REF_NAME}" --format '{{json .Manifest}}' | jq -r '.digest')" = "$digest"
          done
      - name: Publish unchanged release assets
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          flags=(); if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          mapfile -d '' assets < <(find candidate -maxdepth 1 -type f -print0)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No sealed candidate files were downloaded for release." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --verify-tag "${flags[@]}"
