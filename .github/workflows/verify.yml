name: Verify

on:
  push:
    branches: [staging, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_PASSWORD: migration-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    permissions:
      actions: read
      contents: read
    env:
      CI: "true"
      GH_TOKEN: ${{ secrets.TREESEED_GITHUB_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        timeout-minutes: 20
        run: npm ci --ignore-scripts --workspaces=false --no-audit --no-fund
      - uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@410e9077c370426f156cc1b1b3666eaa88408228
        with:
          github-token: ${{ github.token }}
          paths: |
            node_modules/@treeseed/sdk
            node_modules/@treeseed/deployment/node_modules/@treeseed/sdk
      - run: npm run verify:direct
      - name: Verify real PostgreSQL backup-writer migration closure
        env:
          TREESEED_TEST_POSTGRES_URL: postgres://postgres:migration-test-only@127.0.0.1:5432/postgres
        run: npx vitest run --config vitest.control-plane.config.ts tests/unit/control-plane/services/live/replication-migration-postgres.test.ts
      - name: Verify transactional identity mapping in PostgreSQL
        env:
          TREESEED_TEST_POSTGRES_URL: postgres://postgres:migration-test-only@127.0.0.1:5432/postgres
        run: npx vitest run --config vitest.control-plane.config.ts tests/unit/control-plane/accounts/identity-mapping-postgres.test.ts tests/unit/control-plane/accounts/browser-session-postgres.test.ts tests/unit/control-plane/accounts/restricted-runtime-postgres.test.ts tests/unit/control-plane/accounts/identity/principal-store-postgres.test.ts tests/unit/control-plane/accounts/workloads
      - name: Verify concurrent PostgreSQL pool and workday policy allocation
        env:
          TREESEED_TEST_POSTGRES_URL: postgres://postgres:migration-test-only@127.0.0.1:5432/postgres
        run: npx vitest run --config vitest.control-plane.config.ts tests/unit/control-plane/accounts/postgres/pool-budget.test.ts tests/unit/control-plane/capacity/workdays/profile-postgres.test.ts tests/unit/control-plane/capacity/workdays/lifecycle/concurrent-runs-postgres.test.ts tests/unit/control-plane/capacity/execution/admission/timeout-postgres.test.ts tests/unit/control-plane/capacity/execution/admission/postgres.test.ts tests/unit/control-plane/capacity/communication/discussion-supply-postgres.test.ts
      - name: Pack verified artifact
        run: mkdir -p artifacts && npm pack --json --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: api-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
