name: Verify

on:
  push:
    branches: [staging, main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_PASSWORD: migration-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    permissions:
      actions: read
      contents: read
    env:
      CI: "true"
      GH_TOKEN: ${{ secrets.TREESEED_GITHUB_TOKEN || github.token }}
      TREESEED_TEST_POSTGRES_URL: postgres://postgres:migration-test-only@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        timeout-minutes: 20
        run: npm ci --ignore-scripts --workspaces=false --no-audit --no-fund
      - name: Checkout exact native TreeDX
        uses: actions/checkout@v4
        with:
          repository: treeseed-ai/treedx
          ref: 7e9a896df4040051464d312ea0de96b098b922f5
          path: .treeseed/tools/treedx
      - name: Checkout exact execution authority
        uses: actions/checkout@v4
        with:
          repository: treeseed-ai/platform
          ref: e4c4cad1e526f53d3549c8fc27c3e60122b20ee4
          path: .treeseed/tools/platform
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: erlef/setup-beam@v1
        env:
          ImageOS: ubuntu24
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - name: Verify all native TreeDX server prerequisites
        working-directory: .treeseed/tools/treedx
        run: |
          ./scripts/verification/test-all.sh
      - name: Build the verified native TreeDX engine
        working-directory: .treeseed/tools/treedx/apps/api
        run: MIX_ENV=dev mix compile
      - uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@dff6758d0cdebe42da6d0b936e4c862dd6d63b2d
        env:
          NODE_ENV: production
        with:
          github-token: ${{ github.token }}
          paths: |
            node_modules/@treeseed/sdk
      - name: Reconcile installed dependencies with the original locked tree
        run: npm prune --ignore-scripts --no-audit --no-fund --workspaces=false
      - run: ./scripts/build/hydrate-exact-sdk.sh artifacts/sealed-sdk download
      - name: Provision disposable signed native TreeDX
        run: node --import tsx scripts/verification/native-treedx.ts start
      - name: Verify all native TreeDX client SDK prerequisites
        working-directory: .treeseed/tools/treedx
        run: ./scripts/verification/test-sdk-packages.sh
      - run: npm run verify:direct
      - name: Verify real PostgreSQL backup-writer migration closure
        run: npx vitest run --config vitest.control-plane.config.ts tests/unit/control-plane/services/live/replication-migration-postgres.test.ts
      - name: Verify transactional identity mapping in PostgreSQL
        run: npx vitest run --config vitest.control-plane.config.ts tests/unit/control-plane/accounts/identity-mapping-postgres.test.ts tests/unit/control-plane/accounts/browser-session-postgres.test.ts tests/unit/control-plane/accounts/restricted-runtime-postgres.test.ts tests/unit/control-plane/accounts/identity/principal-store-postgres.test.ts tests/unit/control-plane/accounts/workloads
      - name: Verify concurrent PostgreSQL pool and workday policy allocation
        run: npx vitest run --config vitest.control-plane.config.ts tests/unit/control-plane/accounts/postgres/pool-budget.test.ts tests/unit/control-plane/capacity/workdays/profile-postgres.test.ts tests/unit/control-plane/capacity/workdays/continuation.test.ts tests/unit/control-plane/capacity/workdays/lifecycle/concurrent-runs-postgres.test.ts tests/unit/control-plane/capacity/execution/admission/timeout-postgres.test.ts tests/unit/control-plane/capacity/execution/admission/postgres.test.ts tests/unit/control-plane/capacity/communication/discussion-supply-postgres.test.ts tests/unit/control-plane/providers/assignments/provider-discussion-response-postgres.test.ts
      - name: Pack verified artifact
        run: |
          mkdir -p source-assets
          npm pack --json --ignore-scripts --pack-destination source-assets
          npm sbom --sbom-format cyclonedx > source-assets/sbom.cdx.json
      - name: Execute coded golden component scenes
        uses: treeseed-ai/reviewer/.github/actions/run-scenes@2b65e70db059b0c3e4b0cb4937130a1bb3ba61ae
        with:
          ids: guarantee.api.golden.component-boundaries
      - uses: actions/upload-artifact@v4
        with:
          name: api-${{ github.sha }}
          path: source-assets/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-source-${{ github.sha }}
          path: |
            source-assets/
            artifacts/sealed-sdk/
          if-no-files-found: error
      - name: Retain native prerequisite logs
        if: always() && env.API_NATIVE_TREEDX_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: native-prerequisite-evidence-${{ github.sha }}
          path: ${{ env.API_NATIVE_TREEDX_ROOT }}/*.log
          if-no-files-found: error
      - name: Close allocated native TreeDX and signer server
        if: always()
        run: node --import tsx scripts/verification/native-treedx.ts stop
