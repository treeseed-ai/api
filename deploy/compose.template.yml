name: treeseed-api
services:
  migration:
    image: "@API_IMAGE@"
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    env_file: /etc/treeseed/components/api/environment
    environment:
      TREESEED_DATABASE_URL_FILE: /run/treeseed/postgres/api/url
    volumes:
      - type: bind
        source: /run/treeseed/postgres-clients/api/api/migration
        target: /run/treeseed/postgres/api
        read_only: true
    networks: [private, database]
    security_opt: ["no-new-privileges:true"]
  api:
    image: "@API_IMAGE@"
    restart: unless-stopped
    env_file: /etc/treeseed/components/api/environment
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TREESEED_API_PROVIDER_AUTH: control-plane-postgres
      TREESEED_CAPACITY_ENCRYPTION_KEY_FILE: /run/treeseed-keys/credentials
      TREESEED_DIAGNOSTICS_ENCRYPTION_KEY_FILE: /run/treeseed-keys/diagnostics
      TREESEED_DATABASE_URL_FILE: /run/treeseed/postgres/api/url
    networks: [private, database, platform, treeseed-edge]
    expose: ["3000"]
    volumes:
      - type: bind
        source: /run/treeseed/postgres-clients/api/api/runtime
        target: /run/treeseed/postgres/api
        read_only: true
      - type: bind
        source: /run/treeseed/component-credentials/api
        target: /run/treeseed-keys
        read_only: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
  operations-runner:
    image: "@RUNNER_IMAGE@"
    command: ["node", "./dist/operations-runner/entrypoint.js", "run"]
    restart: unless-stopped
    env_file: /etc/treeseed/components/api/environment
    environment:
      NODE_ENV: production
      TREESEED_API_BASE_URL: http://api:3000
      TREESEED_PLATFORM_RUNNER_DATA_DIR: /data
    depends_on:
      api: { condition: service_healthy }
    volumes:
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/api/operations-runner
        target: /data
    networks: [private, platform]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
networks:
  private: { internal: true }
  database:
    name: treeseed-postgres-private
    external: true
  platform:
    name: treeseed-platform
    external: true
  treeseed-edge:
    name: treeseed-edge
    external: true
