notes:
  - "Require exact proposal revision/digest and decision evidence, complete owner and independent review estimates, workspace and permission ceilings, resolved conditions, stable Actor/Reviewer identities, and source-provenance edges."
  - "Mid-workday content changes reconcile only the affected connected component without rewriting running assignment snapshots. Identical reconciliation is a noop with no duplicate nodes, edges, assignments, reservations, or settlements."
  - "Cross-project dependencies require explicit exact TreeDX relations and read grants; never copy a project graph or silently omit an unresolved relation."
  - "Reject caller-authored graph, node, assignment, source, role-map, execution-input, demand, and capacity-plan state. No legacy graph or synthesis path participates."
