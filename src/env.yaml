entries:
  TREESEED_WEB_SERVICE_ID:
    label: API service caller ID
    group: auth
    description: Stable internal service identity used by trusted web, smoke, and API-adjacent clients when they call the Treeseed API.
    howToGet: Use a short service identifier such as web.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
      - github-variable
      - cloudflare-var
    appTargets:
      - api
    serviceTargets:
      - api
    scopes:
      - local
      - staging
      - prod
    storage: shared
    requirement: required
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    defaultValueRef: webServiceIdDefault
    localDefaultValueRef: webServiceIdDefault
    relevanceRef: apiSurfaceEnabled
  TREESEED_WEB_SERVICE_SECRET:
    label: API service caller secret
    group: auth
    description: Shared secret used by trusted web, smoke, and API-adjacent clients to authenticate internal calls to the Treeseed API.
    howToGet: Generate a strong random secret and configure the same value on callers and the API service.
    sensitivity: secret
    targets:
      - local-runtime
      - railway-secret
      - github-secret
      - cloudflare-secret
    appTargets:
      - api
    serviceTargets:
      - api
    scopes:
      - local
      - staging
      - prod
    storage: shared
    requirement: required
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    defaultValueRef: generatedSecret
    localDefaultValueRef: generatedSecret
    relevanceRef: apiSurfaceEnabled
  TREESEED_SMTP_HOST:
    label: SMTP host
    group: auth-email
    description: SMTP hostname used by the API to deliver registration, verification, invitation, and password-reset email.
    howToGet: Use the hostname supplied by the transactional email provider.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
    scopes:
      - local
      - staging
      - prod
    storage: shared
    requirement: conditional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: smtpEnabled
    requiredWhenRef: smtpEnabled
  TREESEED_SMTP_PORT:
    label: SMTP port
    group: auth-email
    description: SMTP port used by the API transactional email transport.
    howToGet: Use the port supplied by the transactional email provider, typically 587 for STARTTLS or 465 for implicit TLS.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
    scopes:
      - local
      - staging
      - prod
    storage: shared
    requirement: conditional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: number
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: smtpEnabled
    requiredWhenRef: smtpEnabled
  TREESEED_SMTP_USERNAME:
    label: SMTP username
    group: auth-email
    description: SMTP account username used by the API transactional email transport.
    howToGet: Use the SMTP username supplied by the transactional email provider.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
    scopes:
      - local
      - staging
      - prod
    storage: shared
    requirement: conditional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: smtpEnabled
    requiredWhenRef: smtpEnabled
  TREESEED_SMTP_PASSWORD:
    label: SMTP password
    group: auth-email
    description: SMTP account password used by the API transactional email transport.
    howToGet: Store the password or provider-issued SMTP token through Treeseed config.
    sensitivity: secret
    targets:
      - local-runtime
      - railway-secret
    appTargets:
      - api
    serviceTargets:
      - api
    scopes:
      - local
      - staging
      - prod
    storage: shared
    requirement: conditional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: smtpEnabled
    requiredWhenRef: smtpEnabled
  TREESEED_SMTP_FROM:
    label: SMTP sender
    group: auth-email
    description: Verified sender address used for API transactional email.
    howToGet: Use a sender address verified with the transactional email provider.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
    scopes:
      - local
      - staging
      - prod
    storage: shared
    requirement: conditional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: email
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: smtpEnabled
    requiredWhenRef: smtpEnabled
  TREESEED_SMTP_REPLY_TO:
    label: SMTP reply-to address
    group: auth-email
    description: Reply-to address for API transactional email.
    howToGet: Use a monitored support address for replies to transactional messages.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
    scopes:
      - local
      - staging
      - prod
    storage: shared
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: email
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: smtpEnabled
  TREESEED_SMTP_SECURE:
    label: SMTP transport mode
    group: auth-email
    description: Optional SMTP transport override. The API defaults to STARTTLS on port 587 and implicit TLS on port 465.
    howToGet: Set starttls, tls, or off only when the transactional email provider requires an override.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
    scopes:
      - local
      - staging
      - prod
    storage: shared
    requirement: optional
    purposes:
      - dev
      - deploy
      - config
    validation:
      kind: string
    sourcePriority:
      - machine-config
      - process-env
    relevanceRef: smtpEnabled
  TREESEED_DATABASE_URL:
    label: Treeseed PostgreSQL database URL
    group: hosting
    cluster: hosting:treeseed-control-plane
    visibility: system
    description: PostgreSQL connection URL for Treeseed control-plane tables. Local development derives this from the managed local API Postgres configuration; hosted environments receive the reconciled Railway PostgreSQL connection URL. Browser/UI code must never receive this value.
    howToGet: For local development, Treeseed derives this from the local API Postgres port and database defaults. For staging and production, provision the managed Treeseed PostgreSQL resource through Treeseed/Railway reconciliation and store the generated connection URL as a service secret.
    sensitivity: secret
    targets:
      - local-runtime
      - railway-secret
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: url
    sourcePriority:
      - generated
      - machine-config
      - process-env
    localDefaultValueRef: localApiDatabaseUrlDefault
  TREESEED_CAPACITY_ACCEPTANCE_API_URL:
    label: Capacity acceptance API URL
    group: capacity-provider
    description: Base URL used by local and hosted capacity-provider acceptance proofs when creating and verifying diagnostic assignments.
    howToGet: Local development derives this from the managed API base URL; hosted environments should set it to the target Treeseed API URL.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - dev
      - test
      - config
    validation:
      kind: url
    sourcePriority:
      - generated
      - machine-config
      - process-env
  TREESEED_CAPACITY_ACCEPTANCE_ADMIN_TOKEN:
    label: Capacity acceptance admin token
    group: capacity-provider
    description: Team-management token used by capacity acceptance proof to create isolated diagnostic assignment records. In local development this may use the local-only generated acceptance token.
    howToGet: Local development uses the generated local-only acceptance token; hosted environments should provide a scoped team-management token for the proof team.
    sensitivity: secret
    targets:
      - local-runtime
      - railway-secret
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - dev
      - test
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - generated
      - machine-config
      - process-env
  TREESEED_CAPACITY_ACCEPTANCE_TEAM_ID:
    label: Capacity acceptance team id
    group: capacity-provider
    description: Team id or slug used by capacity acceptance proof.
    howToGet: Local development derives this from the seeded Treeseed team; hosted environments should use the dedicated proof team id.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - dev
      - test
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - generated
      - machine-config
      - process-env
  TREESEED_CAPACITY_ACCEPTANCE_PROJECT_ID:
    label: Capacity acceptance project id
    group: capacity-provider
    description: Project id or slug used by capacity acceptance proof.
    howToGet: Local development derives this from the seeded Market project; hosted environments should use the dedicated proof project id.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - dev
      - test
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - generated
      - machine-config
      - process-env
  TREESEED_CAPACITY_ACCEPTANCE_PROVIDER_ID:
    label: Capacity acceptance provider id
    group: capacity-provider
    description: Capacity provider id used by capacity acceptance proof.
    howToGet: Local development derives this from the seeded local provider; hosted environments should use the registered proof capacity provider id.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - dev
      - test
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - generated
      - machine-config
      - process-env
  TREESEED_CAPACITY_ACCEPTANCE_AGENT_CLASS_ID:
    label: Capacity acceptance agent class id
    group: capacity-provider
    description: Project agent class id used by capacity acceptance proof; local proof creates this diagnostic class when absent.
    howToGet: Local development uses the generated planning class id; hosted environments should use an agent class available to the proof project.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - dev
      - test
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - generated
      - machine-config
      - process-env
  TREESEED_CAPACITY_ACCEPTANCE_ENVIRONMENT:
    label: Capacity acceptance environment
    group: capacity-provider
    description: Environment label used by capacity acceptance proof.
    howToGet: Local development uses local; hosted acceptance should set this to staging.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - dev
      - test
      - config
    validation:
      kind: enum
      values:
        - local
        - staging
        - prod
    sourcePriority:
      - generated
      - machine-config
      - process-env
  TREESEED_PLATFORM_RUNNER_SECRET:
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
  TREESEED_OPERATIONS_RUNNER_INTERNAL_URL:
    label: Operations runner internal URL
    group: platform
    visibility: system
    description: HTTPS or loopback-only endpoint used for transient single-use credential delivery to the operations runner.
    howToGet: Local development uses the managed loopback operations-runner endpoint. Hosted environments must use the reconciled private HTTPS or service-network endpoint.
    sensitivity: plain
    targets:
      - local-runtime
      - railway-var
    appTargets:
      - api
    serviceTargets:
      - api
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - dev
      - config
    validation:
      kind: url
    sourcePriority:
      - generated
      - machine-config
      - process-env
  TREESEED_PLATFORM_RUNNER_ID:
    appTargets:
      - api
    serviceTargets:
      - operationsRunner
  TREESEED_PLATFORM_RUNNER_DATA_DIR:
    appTargets:
      - api
    serviceTargets:
      - operationsRunner
  TREESEED_PLATFORM_RUNNER_ENVIRONMENT:
    appTargets:
      - api
    serviceTargets:
      - operationsRunner
  TREESEED_GITHUB_REPOSITORY_APP_ID:
    label: GitHub Repository Connector App ID
    group: github
    cluster: secrets-capability:github-app
    visibility: system
    description: Repository Connector App id used to mint repository-scoped Contents tokens.
    howToGet: Create the private Repository Connector App and copy its numeric App ID.
    sensitivity: plain
    targets:
      - railway-var
      - github-variable
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
  TREESEED_PROVIDER_CONNECTOR_BASE_URL:
    label: Provider Connector public base URL
    group: github
    cluster: secrets-capability:provider-connectors
    visibility: system
    description: HTTPS public origin used only for provider installation, authorization, and webhook callbacks.
    howToGet: Set this to the reconciled Cloudflare Tunnel hostname in local development or the reviewed connector ingress origin.
    sensitivity: plain
    targets: [local-runtime, railway-var, github-variable]
    appTargets: [api]
    serviceTargets: [api]
    scopes: [local, staging, prod]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: url }
    sourcePriority: [machine-config, process-env]
  TREESEED_PROVIDER_CONNECTOR_STATE_SECRET:
    label: Provider Connector callback state secret
    group: github
    cluster: secrets-capability:provider-connectors
    visibility: system
    description: Dedicated HMAC secret for short-lived provider connector callback state.
    howToGet: Generate an independent random value of at least 32 bytes and store it as a protected service secret.
    sensitivity: secret
    targets: [local-runtime, railway-secret, github-secret]
    appTargets: [api]
    serviceTargets: [api]
    scopes: [local, staging, prod]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: nonempty, minLength: 32 }
    sourcePriority: [machine-config, process-env]
  TREESEED_GITHUB_REPOSITORY_APP_CLIENT_ID:
    label: GitHub Repository Connector client ID
    group: github
    cluster: secrets-capability:github-app
    visibility: system
    description: Optional GitHub App client id used for installation and onboarding URLs when the API needs to present connected-mode GitHub App flows.
    howToGet: Copy the Client ID from the Treeseed GitHub App settings when onboarding flows need it.
    sensitivity: plain
    targets:
      - railway-var
      - github-variable
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
  TREESEED_GITHUB_REPOSITORY_APP_CLIENT_SECRET:
    label: GitHub Repository Connector client secret
    group: github
    cluster: secrets-capability:github-app
    visibility: system
    description: OAuth client secret used only during the Repository Connector user-authorization callback.
    howToGet: Generate the client secret in the Repository Connector App settings and store it as a protected service secret.
    sensitivity: secret
    targets: [local-runtime, railway-secret, github-secret]
    appTargets: [api]
    serviceTargets: [api]
    scopes: [local, staging, prod]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: nonempty, minLength: 16 }
    sourcePriority: [machine-config, process-env]
  TREESEED_GITHUB_REPOSITORY_APP_SLUG:
    label: GitHub Repository Connector App slug
    group: github
    cluster: secrets-capability:github-app
    visibility: system
    description: Public GitHub App slug used to construct the selected-repository installation URL.
    howToGet: Copy the URL slug shown on the Repository Connector App settings page.
    sensitivity: plain
    targets: [local-runtime, railway-var, github-variable]
    appTargets: [api]
    serviceTargets: [api]
    scopes: [local, staging, prod]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: nonempty }
    sourcePriority: [machine-config, process-env]
  TREESEED_GITHUB_REPOSITORY_APP_PRIVATE_KEY:
    label: GitHub Repository Connector private key
    group: github
    cluster: secrets-capability:github-app
    visibility: system
    description: Connector bootstrap key used only to sign short-lived installation-token requests; never delivered to TreeDX or a capacity provider.
    howToGet: Generate a private key for the Repository Connector App and store the PEM value as a secret.
    sensitivity: secret
    targets:
      - railway-secret
      - github-secret
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
    sourcePriority:
      - machine-config
      - process-env
  TREESEED_GITHUB_REPOSITORY_APP_WEBHOOK_SECRET:
    label: GitHub Repository Connector webhook secret
    group: github
    cluster: secrets-capability:github-app
    visibility: system
    description: Shared webhook secret used by the API to validate GitHub App installation and repository grant events.
    howToGet: Generate a strong webhook secret in GitHub App settings and store the same value as a service secret.
    sensitivity: secret
    targets:
      - railway-secret
      - github-secret
    appTargets:
      - api
    serviceTargets:
      - api
    scopes:
      - local
      - staging
      - prod
    storage: scoped
    requirement: optional
    purposes:
      - deploy
      - config
    validation:
      kind: nonempty
      minLength: 16
    sourcePriority:
      - machine-config
      - process-env
  TREESEED_GITHUB_WORKFLOW_APP_ID:
    label: GitHub Workflow Connector App ID
    group: github
    cluster: secrets-capability:github-workflow-app
    visibility: system
    description: Workflow Connector App id used for Actions dispatch and separately enabled Secrets and Variables operations.
    howToGet: Create the private Workflow Connector App and copy its numeric App ID.
    sensitivity: plain
    targets: [local-runtime, railway-var, github-variable]
    appTargets: [api]
    serviceTargets: [api, operationsRunner]
    scopes: [local, staging, prod]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: nonempty }
    sourcePriority: [machine-config, process-env]
  TREESEED_GITHUB_WORKFLOW_APP_CLIENT_ID:
    label: GitHub Workflow Connector client ID
    group: github
    cluster: secrets-capability:github-workflow-app
    visibility: system
    description: Optional GitHub App client id used for the Workflow Connector installation and authorization flow.
    howToGet: Copy the Client ID from the private Workflow Connector App settings.
    sensitivity: plain
    targets: [local-runtime, railway-var, github-variable]
    appTargets: [api]
    serviceTargets: [api]
    scopes: [local, staging, prod]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: nonempty }
    sourcePriority: [machine-config, process-env]
  TREESEED_GITHUB_WORKFLOW_APP_CLIENT_SECRET:
    label: GitHub Workflow Connector client secret
    group: github
    cluster: secrets-capability:github-workflow-app
    visibility: system
    description: OAuth client secret used only during the Workflow Connector user-authorization callback.
    howToGet: Generate the client secret in the Workflow Connector App settings and store it as a protected service secret.
    sensitivity: secret
    targets: [local-runtime, railway-secret, github-secret]
    appTargets: [api]
    serviceTargets: [api]
    scopes: [local, staging, prod]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: nonempty, minLength: 16 }
    sourcePriority: [machine-config, process-env]
  TREESEED_GITHUB_WORKFLOW_APP_SLUG:
    label: GitHub Workflow Connector App slug
    group: github
    cluster: secrets-capability:github-workflow-app
    visibility: system
    description: Public GitHub App slug used to construct the selected-repository installation URL.
    howToGet: Copy the URL slug shown on the Workflow Connector App settings page.
    sensitivity: plain
    targets: [local-runtime, railway-var, github-variable]
    appTargets: [api]
    serviceTargets: [api]
    scopes: [local, staging, prod]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: nonempty }
    sourcePriority: [machine-config, process-env]
  TREESEED_GITHUB_WORKFLOW_APP_PRIVATE_KEY:
    label: GitHub Workflow Connector private key
    group: github
    cluster: secrets-capability:github-workflow-app
    visibility: system
    description: Connector bootstrap key used only to sign short-lived installation-token requests; never delivered to capacity providers.
    howToGet: Generate a private key for the Workflow Connector App and store its PEM value as a protected service secret.
    sensitivity: secret
    targets: [local-runtime, railway-secret, github-secret]
    appTargets: [api]
    serviceTargets: [api, operationsRunner]
    scopes: [local, staging, prod]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: nonempty }
    sourcePriority: [machine-config, process-env]
  TREESEED_GITHUB_WORKFLOW_APP_WEBHOOK_SECRET:
    label: GitHub Workflow Connector webhook secret
    group: github
    cluster: secrets-capability:github-workflow-app
    visibility: system
    description: Secret used to authenticate Actions run, installation, and repository grant webhooks.
    howToGet: Generate a strong webhook secret in the Workflow Connector App settings and configure the same value in TreeSeed.
    sensitivity: secret
    targets: [local-runtime, railway-secret, github-secret]
    appTargets: [api]
    serviceTargets: [api]
    scopes: [local, staging, prod]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: nonempty, minLength: 16 }
    sourcePriority: [machine-config, process-env]
  TREESEED_TREEDX_CREDENTIAL_BROKER_ASSERTION:
    label: TreeDX credential broker assertion
    group: treedx
    cluster: secrets-capability:treedx-broker
    visibility: system
    description: Service assertion allowing one TreeDX node to consume only its assigned opaque credential delivery.
    howToGet: Generate a strong random service assertion and configure the same value only on the API and its authorized TreeDX node.
    sensitivity: secret
    targets: [local-runtime, railway-secret]
    appTargets: [api]
    serviceTargets: [api, public-treedx-node-01, operationsRunner]
    scopes: [local, staging, prod]
    storage: scoped
    requirement: optional
    purposes: [config]
    validation: { kind: nonempty, minLength: 24 }
    sourcePriority: [machine-config, process-env]
  TREESEED_GITHUB_TOKEN:
    cluster: secrets-capability:repository-credentials
    targets:
      - local-runtime
      - railway-secret
      - github-secret
    appTargets:
      - api
    serviceTargets:
      - api
      - operationsRunner
    purposes:
      - save
      - deploy
      - config
  TREESEED_PUBLIC_TREEDX_IMAGE_REF:
    label: Public TreeDX image reference
    group: railway
    cluster: hosting:public-treedx
    description: Container image reference used for the shared public TreeDX federation node.
    howToGet: Use the TreeDX release image tag that should be deployed for the selected environment.
