name: extension
version: 1
description: Cross-seed stable resource reference fixture

defaultEnvironments: [staging]
environments: [staging]

references:
  - team:treeseed

resources:
  projects:
    - key: project:treeseed/extension
      team: team:treeseed
      slug: extension
      name: TreeSeed Extension
      description: Project created inside a team owned by another seed.
      kind: package
      repository:
        role: primary
        provider: github
        owner: treeseed-ai
        name: extension
        gitUrl: https://github.com/treeseed-ai/extension.git
        defaultBranch: main
      architecture:
        topology: split_site_content
        rootPath: .
        sitePath: docs
        contentPath: src/content
        contentRuntimeSource: r2_preview_overlay
        localContentMaterialization: none
