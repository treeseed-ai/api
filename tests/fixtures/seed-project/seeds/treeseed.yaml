name: treeseed
version: 1
description: Bounded API seed reconciliation fixture

defaultEnvironments: [local]
environments: [local, staging, prod]

resources:
  teams:
    - key: team:treeseed
      slug: treeseed
      name: treeseed
      displayName: TreeSeed
      metadata:
        visibility: public

  teamMemberships:
    - key: membership:treeseed/adrian-webb
      team: team:treeseed
      email: adrian.webb@treeseed.dev
      roles: [team_owner]
      missingUser: defer

  projects:
    - key: project:treeseed/api
      team: team:treeseed
      slug: api
      name: TreeSeed API
      description: Seed reconciliation fixture project.
      kind: software_package
      repository:
        role: primary
        provider: github
        owner: treeseed-ai
        name: api
        gitUrl: https://github.com/treeseed-ai/api.git
        defaultBranch: main
        checkoutPath: .
      architecture:
        topology: single_repository_site
        rootPath: .
        sitePath: .
        contentPath: src/content
        contentRuntimeSource: local_directory
        localContentMaterialization: existing_path
      metadata:
        visibility: public
