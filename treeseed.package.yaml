id: "@treeseed/api"
name: TreeSeed API
kind: node-typescript
type: hosted-service
repository: treeseed-ai/api
publishTarget: docker
capabilities: { save: true, verify: true, publish: true, deploy: true, localOnly: false }
deploymentSource:
  staging: git
  prod: image
workflowTemplateVersion: "1"
githubEnvironments:
  - staging
  - production
requiredSecrets:
  - DOCKERHUB_TOKEN
  - TREESEED_TREEDX_ADMIN_TOKEN
  - TREESEED_TREEDX_SECRET_KEY_BASE
  - TREESEED_TREEDX_JWT_HS256_SECRET
requiredVariables:
  - DOCKERHUB_USERNAME
verify:
  fast: npm run verify
  local: npm run verify:local
  release: npm run release:verify
artifacts:
  - provider: docker
    name: treeseed/api
    dockerfile: Dockerfile
    target: api
    architectures:
      - amd64
      - arm64
  - provider: docker
    name: treeseed/op-runner
    dockerfile: Dockerfile
    target: operations-runner
    architectures:
      - amd64
      - arm64
releaseGate:
  workflow: verify.yml
  timeoutSeconds: 1800
dockerImages:
  architectures:
    - amd64
    - arm64
  tags:
    release:
      - "<version>"
      - latest
projectArchitecture:
  topology: split_site_content
  rootPath: .
  sitePath: docs
  contentPath: src/content
  contentRuntimeSource: r2_preview_overlay
  localContentMaterialization: none
  contentPublishTarget:
    kind: cloudflare_r2
    prefix: packages/api
development:
  schemaVersion: treeseed.development-runtime/v1
  project: { id: api, repository: treeseed-ai/api }
  defaults: { leaseSeconds: 14400, restoreOnFailure: true }
  targets:
    - id: service
      kind: live-api
      platforms: [linux-amd64, linux-arm64, darwin-arm64, darwin-amd64]
      runtimeRequirements: [node>=22, postgresql]
      sourceRoots: [src, drizzle, compose.development.yml]
      ignoredPaths: [dist, node_modules]
      operations:
        start: { command: docker, args: [compose, --file, compose.development.yml, --project-name, treeseed-api-development, up, --no-deps, api-live], environment: { TREESEED_DEVELOPMENT_EDGE_HOST: api-live }, timeoutSeconds: 86400 }
        cleanup: { command: bash, args: [scripts/development/api-runtime.sh, cleanup], environment: {}, timeoutSeconds: 120 }
        build: { command: npm, args: [run, build:dist], environment: {}, timeoutSeconds: 1800 }
        verify: { command: npm, args: [run, test:control-plane], environment: {}, timeoutSeconds: 1800 }
      ready: { kind: http, path: /v1/health/ready, expectedStatus: 200, timeoutSeconds: 120 }
      outputs: [{ path: docs/api/openapi.json, mediaType: application/vnd.oai.openapi+json, digestAlgorithm: sha256 }]
      endpoints: [{ id: http, protocol: http, port: 3000, canonicalAlias: api.treeseed.localhost, visibility: host, authentication: application }]
      dependencies: [{ id: sdk, target: package, locality: local, reaction: restart }]
      statePolicy: shared-compatible
      migrationPolicy: explicit-review
      secretRefs:
        POSTGRES_PASSWORD: api-postgres-password
        TREESEED_DATABASE_URL: api-database-url
        SESSION_SECRET: api-session-secret
        TREESEED_TREEDX_DELEGATION_PRIVATE_KEY: api-treedx-delegation-private-key
        TREESEED_TREEDX_CREDENTIAL_BROKER_ASSERTION: treedx-credential-broker-assertion
        TREESEED_GITHUB_TOKEN: github-repository-token
      shutdown: { graceSeconds: 30, activeWorkPolicy: drain }
      resources: {}
      logs: [.treeseed/development/api.log]
      forbiddenOperations: [automatic-shared-migration, credential-log, host-network, public-database-port]
      freeze:
        kind: archive
        operation: { command: npm, args: [pack, --json], environment: {}, timeoutSeconds: 1800 }
        artifacts: [treeseed-api-*.tgz]
        contractOperations: []
      promotion: { liveAdmissible: false, candidateRequiresVerification: true }
    - id: operations-runner
      kind: rebuild-restart
      platforms: [linux-amd64, linux-arm64]
      runtimeRequirements: [node>=22]
      sourceRoots: [src/operations-runner, src/api/knowledge, src/api/providers/cloudflare, src/security, src/providers, drizzle]
      ignoredPaths: [dist, node_modules]
      operations:
        build: { command: npm, args: [run, build:dist], environment: {}, timeoutSeconds: 1800 }
        setup: { command: bash, args: [scripts/development/operations-runner-runtime.sh, takeover], environment: {}, timeoutSeconds: 120 }
        start: { command: docker, args: [compose, --file, compose.development.yml, --project-name, treeseed-api-development, up, --no-deps, operations-runner-live], environment: { TREESEED_DEVELOPMENT_EDGE_HOST: operations-runner-live }, timeoutSeconds: 86400 }
        cleanup: { command: bash, args: [scripts/development/operations-runner-runtime.sh, cleanup], environment: {}, timeoutSeconds: 120 }
        verify: { command: npm, args: [run, test:control-plane], environment: {}, timeoutSeconds: 1800 }
      ready: { kind: process, graceSeconds: 5 }
      outputs: [{ path: dist/operations-runner, mediaType: application/vnd.treeseed.node-runtime, digestAlgorithm: sha256 }]
      endpoints: []
      dependencies:
        - { id: sdk, target: package, locality: local, reaction: rebuild }
        - { id: api, target: service, locality: local, reaction: restart }
      statePolicy: shared-compatible
      migrationPolicy: explicit-review
      secretRefs:
        TREESEED_DATABASE_URL: api-database-url
        TREESEED_CLOUDFLARE_ACCOUNT_ID: cloudflare-r2-account-id
        TREESEED_CLOUDFLARE_API_TOKEN: cloudflare-r2-management-token
        TREESEED_CONTENT_BUCKET_NAME: cloudflare-r2-bucket-name
        TREESEED_R2_ACCESS_KEY_ID: cloudflare-r2-access-key-id
        TREESEED_R2_SECRET_ACCESS_KEY: cloudflare-r2-secret-access-key
        TREESEED_TREEDX_DELEGATION_PRIVATE_KEY: api-treedx-delegation-private-key
        TREESEED_TREEDX_CREDENTIAL_BROKER_ASSERTION: treedx-credential-broker-assertion
        TREESEED_GITHUB_TOKEN: github-repository-token
      shutdown: { graceSeconds: 60, activeWorkPolicy: drain }
      resources: {}
      logs: [.treeseed/development/operations-runner.log]
      forbiddenOperations: [hot-reload, automatic-assignment-cancel]
      promotion: { liveAdmissible: false, candidateRequiresVerification: true }
standards:
  schemaVersion: 1
  workflow: { enabled: true }
  acceptedBaseline: { packageName: "@treeseed/api", packageVersion: "0.8.0-rc.41" }
  produced:
    - { id: "@treeseed/api/control-plane", family: http-api, version: "1.0.0", semanticRange: "^1.0.0", source: src/api/control-plane, artifact: docs/api/openapi.json, verifier: scripts/packages/release-verify.ts }
    - { id: "@treeseed/api/identity-team-verifier", family: behavioral, version: "1.0.0", semanticRange: "^1.0.0", source: src/standards/verifiers, artifact: dist/standards/verifiers/identity-team-live.js, verifier: dist/standards/verifiers/identity-team-live.js }
  consumed:
    - { id: "@treeseed/sdk/control-plane-catalog", family: json-schema, version: "1.0.0", semanticRange: "^1.0.0", source: node_modules/@treeseed/sdk, verifier: scripts/packages/release-verify.ts }
  guarantees: [authentication-lifecycle, account-custody, team-authority, immutable-live-verifier]
  deprecations: []
  runtimes: [node>=22, cloudflare-workers]
  rollbackOperations: [restore-prior-component-release, restore-prior-database-backup]
localDev:
  services:
    api:
      script: dev:api
      hostEnv: HOST
      portEnv: PORT
      defaultPort: 3000
      healthPath: /v1/health/ready
    operationsRunner:
      script: dev:runner
  database:
    kind: postgres
    managed: true
    host: 127.0.0.1
    defaultPort: 54329
    portEnv: TREESEED_MARKET_LOCAL_POSTGRES_PORT
    urlEnv: TREESEED_DATABASE_URL
    compatibilityUrlEnv: TREESEED_MARKET_DATABASE_URL
    containerName: treeseed-api-postgres
    volumeName: treeseed-api-postgres-volume
    user: treeseed
    password: treeseed-local-dev
    database: treeseed_api
  migrations:
    command: node
    args:
      - scripts/support/migrate-db.ts
packageRuntime:
  schemaVersion: treeseed.package-runtime/v1
  componentId: api
  services:
    - id: api
      composeService: api
      endpoints:
        - id: http
          protocol: http
          port: 3000
          visibility: host
          defaultAlias: api.treeseed.localhost
          aliasOverride: true
          tls: edge
          authentication: application
          healthGate: { protocol: http, path: /v1/health/ready, timeoutSeconds: 120 }
    - id: operations-runner
      composeService: operations-runner
      endpoints: []
    - id: database
      composeService: database
      endpoints: []
    - id: migration
      composeService: migration
      endpoints: []
